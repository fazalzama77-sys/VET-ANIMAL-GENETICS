    <text x="215" y="17" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Conservation of Animal Genetic Resources (AnGR) protects unique indigenous livestock diversity against extinction through in-situ habitat conservation and ex-situ in-vivo/cryogenic gene banking under FAO guidelines</text>
